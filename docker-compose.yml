volumes:
  n8n_storage:
  postgres_storage:

networks:
  shopiflow:

services:
  postgres:
    image: pgvector/pgvector:pg16
    hostname: postgres
    networks: ['shopiflow']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shopiflow}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shopiflow123}
      - POSTGRES_DB=${POSTGRES_DB:-shopiflow}
    ports:
      - "5433:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${POSTGRES_USER:-shopiflow} -d ${POSTGRES_DB:-shopiflow}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n-import:
    image: n8nio/n8n:latest
    networks: ['shopiflow']
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-shopiflow}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-shopiflow123}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-shopiflow}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-in-production}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-change-me-in-production}
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        if [ -z "$(n8n list:workflow --onlyId 2>/dev/null)" ]; then
          n8n import:workflow --separate --input=/demo-data/workflows && \
          echo "Workflows imported successfully"
        else
          echo "Workflows already exist, skipping import"
        fi
    volumes:
      - ./n8n:/demo-data
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    hostname: n8n
    container_name: shopiflow-n8n
    networks: ['shopiflow']
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-shopiflow}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-shopiflow123}
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-shopiflow}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-in-production}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET:-change-me-in-production}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - SHOPIFY_STORE_DOMAIN=${SHOPIFY_STORE_DOMAIN}
      - SHOPIFY_ACCESS_TOKEN=${SHOPIFY_ACCESS_TOKEN}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n:/demo-data
    depends_on:
      postgres:
        condition: service_healthy
      n8n-import:
        condition: service_completed_successfully
