name: Test Suite

on:
  push:
    branches: [main, feature_v2, develop]
  pull_request:
    branches: [main, feature_v2]

env:
  NODE_VERSION: '20'

jobs:
  # 单元测试 + Lint
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-coverage
          path: coverage/

  # n8n Workflow 集成测试
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: unit-tests

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: shopiflow_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start n8n test instance
        run: |
          docker run -d \
            --name n8n-test \
            --network host \
            -e N8N_BASIC_AUTH_ACTIVE=false \
            -e N8N_HOST=localhost \
            -e N8N_PORT=5678 \
            -e N8N_PROTOCOL=http \
            -e WEBHOOK_URL=http://localhost:5678 \
            -e EXECUTIONS_PROCESS=main \
            -e N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN=true \
            n8nio/n8n:latest

      - name: Wait for n8n to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:5678/healthz; do echo "waiting..."; sleep 3; done'

      - name: Initialize test database
        run: |
          PGPASSWORD=test_password psql -h localhost -p 5433 -U test_user -d shopiflow_test -f database/init.sql

      - name: Import and activate n8n workflows
        run: |
          # 仅导入测试需要的 workflow
          workflow="n8n/workflows/shopify-support-handler.json"
          filename=$(basename "$workflow")

          echo "Importing $filename..."

          # 1. 复制文件到容器内
          docker cp "$workflow" n8n-test:/tmp/"$filename"

          # 2. 导入 workflow
          docker exec n8n-test n8n import:workflow --input=/tmp/"$filename"

          # 等待 n8n 处理导入
          sleep 3

          # 3. 激活 workflow（通过 REST API）
          echo "Activating workflow..."
          response=$(curl -s http://localhost:5678/api/v1/workflows)
          echo "API Response: $response"

          workflow_ids=$(echo "$response" | jq -r '.data[]?.id // empty')
          if [ -z "$workflow_ids" ]; then
            echo "Warning: No workflows found or API returned unexpected format"
          else
            for id in $workflow_ids; do
              echo "Activating workflow $id..."
              curl -X PATCH http://localhost:5678/api/v1/workflows/$id \
                -H "Content-Type: application/json" \
                -d '{"active": true}' || true
            done
          fi

          echo "✓ Workflow imported and activated"

      - name: Run integration tests
        env:
          N8N_TEST_URL: http://localhost:5678
          TEST_DB_HOST: localhost
          TEST_DB_PORT: 5433
          TEST_DB_NAME: shopiflow_test
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test_password
        run: npm run test:integration

      - name: Print n8n logs on failure
        if: failure()
        run: docker logs n8n-test

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: coverage/

      - name: Cleanup
        if: always()
        run: |
          docker stop n8n-test || true
          docker rm n8n-test || true

  # 构建验证
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          N8N_WEBHOOK_BASE_URL: http://localhost:5678
          OPENROUTER_API_KEY: mock-key-for-build

      - name: Check for TypeScript errors
        run: npx tsc --noEmit
        working-directory: apps/frontend

  # 测试报告汇总
  test-summary:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, build-check]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.integration-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build Check: ${{ needs.build-check.result }}" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.build-check.result }}" != "success" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Some tests failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
